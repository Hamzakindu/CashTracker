name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          mkdir -p _src
          FOUND_ZIP=0
          for z in $(ls *.zip *.ZIP 2>/dev/null | LC_ALL=C sort); do
            FOUND_ZIP=1
            echo "Unpacking $z"
            unzip -o -q "$z" -d _src
          done
          
          if [ $FOUND_ZIP -eq 0 ]; then
            echo "❌ ERROR: No .zip file found in the root of the repository."
            echo "Please upload your project zip (e.g., CashTracker.zip) to the repository."
            exit 1
          fi

      - name: Find project folder
        run: |
          settings=$(find _src -name settings.gradle.kts 2>/dev/null | head -1)
          if [ -z "$settings" ]; then settings=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1); fi
          if [ -z "$settings" ]; then echo "No settings.gradle.kts found inside the unzipped folder. Check your zip structure."; exit 1; fi
          dir=$(dirname "$settings")
          echo "Project folder: $dir"
          echo "BUILD_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
        working-directory: ${{ env.BUILD_DIR }}

      - name: Name the APK
        run: |
          APK_PATH="$BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$GITHUB_WORKSPACE/CashTracker.apk"
          else
            echo "❌ Error: app-debug.apk not found at $APK_PATH"
            find "$BUILD_DIR" -name "*.apk"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: CashTracker.apk
