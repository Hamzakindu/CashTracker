name: Build CashTracker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Find and unpack ZIP
      # ---------------------------------------------------------
      - name: Unpack project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p _src

          FOUND_ZIP=0

          while IFS= read -r -d '' ZIPFILE; do
            FOUND_ZIP=1
            echo "========================================"
            echo "Unpacking: $ZIPFILE"
            echo "========================================"

            unzip -o -q "$ZIPFILE" -d _src
          done < <(find . -maxdepth 1 -type f \( -iname "*.zip" \) -print0)

          if [ "$FOUND_ZIP" -eq 0 ]; then
            echo "::error::No project ZIP file found."
            exit 1
          fi

          echo
          echo "Extracted project:"
          find _src -maxdepth 3 -type f | sort | head -100

      # ---------------------------------------------------------
      # 3. Find Android project
      # ---------------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/_src" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts was not found."
            echo "Project contents:"
            find "$GITHUB_WORKSPACE/_src" -maxdepth 5 -type f | sort
            exit 1
          fi

          BUILD_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "Android project found:"
          echo "$BUILD_DIR"
          echo "========================================"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 4. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------------------------------------------------------
      # 5. Setup Gradle
      # ---------------------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------------------------------------------------------
      # 6. Check environment
      # ---------------------------------------------------------
      - name: Check build environment
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          set -x

          echo "========================================"
          echo "Java"
          echo "========================================"
          java -version

          echo
          echo "========================================"
          echo "Gradle"
          echo "========================================"
          gradle --version

          echo
          echo "========================================"
          echo "Project files"
          echo "========================================"
          find . -maxdepth 4 -type f | sort

          echo
          echo "========================================"
          echo "settings.gradle.kts"
          echo "========================================"
          cat settings.gradle.kts

          echo
          echo "========================================"
          echo "Root build.gradle.kts"
          echo "========================================"
          cat build.gradle.kts

          echo
          echo "========================================"
          echo "App build.gradle.kts"
          echo "========================================"
          cat app/build.gradle.kts

      # ---------------------------------------------------------
      # 7. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting Gradle build"
          echo "========================================"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ---------------------------------------------------------
      # 8. Find APK
      # ---------------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching for APK"
          echo "========================================"

          find "$BUILD_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$BUILD_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."

            echo
            echo "Build directory:"
            find "$BUILD_DIR/app/build" -maxdepth 6 -type f 2>/dev/null | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/CashTracker.apk"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          ls -lh "$GITHUB_WORKSPACE/CashTracker.apk"

      # ---------------------------------------------------------
      # 9. Upload APK as Actions artifact
      # ---------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashTracker-debug
          path: CashTracker.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 10. Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CashTracker Build ${{ github.run_number }}
          files: CashTracker.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
