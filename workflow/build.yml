name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          mkdir -p _src
          # Find zips safely, even if they have spaces in the name
          find . -maxdepth 1 -type f \( -iname "*.zip" \) | while read -r z; do
            echo "Unpacking $z"
            unzip -o -q "$z" -d _src
          done

      - name: Find project folder
        run: |
          # Look for settings.gradle.kts or settings.gradle
          settings=$(find _src -name settings.gradle.kts -o -name settings.gradle 2>/dev/null | head -1)
          if [ -z "$settings" ]; then 
            settings=$(find . -name settings.gradle.kts -o -name settings.gradle -not -path './.git/*' | head -1)
          fi
          
          if [ -z "$settings" ]; then 
            echo "❌ Error: No settings.gradle or settings.gradle.kts found."
            echo "Did you commit the zip file to the repository?"
            ls -la
            exit 1
          fi
          
          dir=$(dirname "$settings")
          echo "✅ Project folder found: $dir"
          echo "BUILD_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          # Use local wrapper if it exists, otherwise use global gradle
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
        working-directory: ${{ env.BUILD_DIR }}

      - name: Name the APK
        run: |
          # Verify the APK exists before copying
          APK_PATH="$BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$GITHUB_WORKSPACE/CashTracker.apk"
          else
            echo "❌ Error: app-debug.apk not found at $APK_PATH"
            # Optional: List files to help debug
            find "$BUILD_DIR" -name "*.apk"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: CashTracker.apk
