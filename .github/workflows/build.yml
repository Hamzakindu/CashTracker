name: Build CashTracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project directory
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            PROJECT_DIR=.
          elif [[ -f CashTracker/settings.gradle.kts && -f CashTracker/app/build.gradle.kts ]]; then
            PROJECT_DIR=CashTracker
          else
            echo "Cannot find Android project root. Expected settings.gradle.kts and app/build.gradle.kts in repository root or ./CashTracker/" >&2
            find . -maxdepth 4 \( -name settings.gradle.kts -o -path '*/app/build.gradle.kts' \) -print
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JavaScript and optional TypeScript tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm install --ignore-scripts
            npm test --if-present
            npm run typecheck --if-present
            npm run build:ts --if-present
          else
            echo "No package.json in Android project root; skipping npm scripts. Checking app JavaScript syntax instead."
            find app/src/main/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/cashtracker-signing"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cashtracker-signing/release.jks"
          test -s "$RUNNER_TEMP/cashtracker-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/cashtracker-signing/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/cashtracker-signing/release.jks" >> "$GITHUB_ENV"

      - name: Verify project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test ! -f app/debug.keystore
          test ! -f app/src/main/assets/js/app-lock.js
          java -version
          gradle --version

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon --stacktrace -PVERSION_CODE=${{ github.run_number }}

      - name: Locate release APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/CashTracker-release.apk"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashTracker-release
          path: CashTracker-release.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CashTracker v${{ github.run_number }}
          files: CashTracker-release.apk
          generate_release_notes: true
