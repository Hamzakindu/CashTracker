JJname: Build CashTracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract cashtracker.zip
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -f cashtracker.zip || {
            echo "ERROR: cashtracker.zip must be in the repository root." >&2
            exit 1
          }

          SRC_DIR="$RUNNER_TEMP/cashtracker-source"
          mkdir -p "$SRC_DIR"
          unzip -q cashtracker.zip -d "$SRC_DIR"

          if [[ -f "$SRC_DIR/CashTracker/settings.gradle.kts" &&
                -f "$SRC_DIR/CashTracker/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$SRC_DIR/CashTracker"
          elif [[ -f "$SRC_DIR/settings.gradle.kts" &&
                  -f "$SRC_DIR/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$SRC_DIR"
          else
            echo "ERROR: ZIP does not contain the expected Android Gradle project." >&2
            find "$SRC_DIR" -maxdepth 5 \\( -name settings.gradle.kts -o -path '*/app/build.gradle.kts' \\) -print
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies and run checks
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm install --ignore-scripts
            npm test --if-present
            npm run typecheck --if-present
            npm run build:ts --if-present
          else
            echo "No package.json found; skipping JavaScript package checks."
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64" || {
            echo "Missing GitHub secret RELEASE_KEYSTORE_B64." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/cashtracker-signing"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/cashtracker-signing/release.jks"
          test -s "$RUNNER_TEMP/cashtracker-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/cashtracker-signing/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/cashtracker-signing/release.jks" >> "$GITHUB_ENV"

      - name: Verify Gradle project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test ! -f app/debug.keystore
          java -version
          gradle --version

      - name: Build signed release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_STORE_PASSWORD" || {
            echo "Missing GitHub secret RELEASE_STORE_PASSWORD." >&2
            exit 1
          }
          test -n "$RELEASE_KEY_ALIAS" || {
            echo "Missing GitHub secret RELEASE_KEY_ALIAS." >&2
            exit 1
          }
          test -n "$RELEASE_KEY_PASSWORD" || {
            echo "Missing GitHub secret RELEASE_KEY_PASSWORD." >&2
            exit 1
          }
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PVERSION_CODE="${GITHUB_RUN_NUMBER}"

      - name: Find and stage APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || {
            echo "ERROR: Gradle did not produce a release APK." >&2
            exit 1
          }
          cp "$APK" "$GITHUB_WORKSPACE/CashTracker-release.apk"
          ls -lh "$GITHUB_WORKSPACE/CashTracker-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashTracker-release
          path: CashTracker-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CashTracker v${{ github.run_number }}
          files: CashTracker-release.apk
          generate_release_notes: true
